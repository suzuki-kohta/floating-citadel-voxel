<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="雲海の上空に浮かぶ巨大な浮遊城を純粋なWebGL 3Dボクセルアートで描くフルスクリーン動く壁紙">
  <title>雲海に浮かぶ浮遊城 — 3Dボクセル壁紙</title>
  <link rel="stylesheet" href="./css/style.css?v=3">
</head>
<body>
  <main class="viewport">
    <canvas id="scene-canvas" aria-label="雲海に浮かぶ浮遊城の3Dボクセルアニメーション"></canvas>

    <button
      id="settings-hotspot"
      type="button"
      class="settings-hotspot"
      aria-label="設定パネルを開く"
      aria-controls="settings-panel"
      aria-expanded="false"
    ></button>

    <aside id="settings-panel" class="settings-panel" aria-label="壁紙設定" hidden>
      <header class="panel-header">
        <h1 class="panel-title">壁紙設定</h1>
        <button
          id="close-settings-btn"
          type="button"
          class="icon-btn"
          aria-label="設定を閉じる"
        >×</button>
      </header>

      <div class="panel-body">
        <div class="control-group">
          <span id="time-mode-label" class="control-label">時間帯モード</span>
          <div class="custom-select" data-select="time-mode">
            <button
              type="button"
              id="time-mode-trigger"
              class="select-trigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="time-mode-listbox"
              aria-labelledby="time-mode-label time-mode-value"
            >
              <span id="time-mode-value" class="select-value">自動サイクル</span>
              <svg
                class="select-chevron"
                width="12"
                height="8"
                viewBox="0 0 12 8"
                fill="none"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M1.5 1.75L6 6.25L10.5 1.75"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <ul id="time-mode-listbox" class="select-options" role="listbox" aria-labelledby="time-mode-label" hidden>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="auto" aria-selected="true">自動サイクル</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="realtime" aria-selected="false">現在時刻連動</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="dawn" aria-selected="false">朝</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="day" aria-selected="false">昼</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="sunset" aria-selected="false">夕焼け</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="night" aria-selected="false">夜</button></li>
            </ul>
          </div>
        </div>

        <div class="control-group">
          <span id="quality-label" class="control-label">画質・省電力</span>
          <div class="custom-select" data-select="quality">
            <button
              type="button"
              id="quality-trigger"
              class="select-trigger"
              aria-haspopup="listbox"
              aria-expanded="false"
              aria-controls="quality-listbox"
              aria-labelledby="quality-label quality-value"
            >
              <span id="quality-value" class="select-value">標準</span>
              <svg
                class="select-chevron"
                width="12"
                height="8"
                viewBox="0 0 12 8"
                fill="none"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M1.5 1.75L6 6.25L10.5 1.75"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <ul id="quality-listbox" class="select-options" role="listbox" aria-labelledby="quality-label" hidden>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="high" aria-selected="false">高画質</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="medium" aria-selected="true">標準</button></li>
              <li role="presentation"><button type="button" class="select-option" role="option" data-value="eco" aria-selected="false">省電力</button></li>
            </ul>
          </div>
        </div>

        <div class="control-group">
          <button
            id="pause-toggle-btn"
            type="button"
            class="action-btn"
            aria-pressed="false"
          >一時停止</button>
        </div>

        <p id="status-readout" class="status-readout" aria-live="polite"></p>
      </div>

      <footer class="panel-footer">
        <p class="panel-hint">
          <kbd>H</kbd> キーまたは右下隅クリックで開閉 / <kbd>Esc</kbd> で閉じる
        </p>
      </footer>
    </aside>

    <section id="fallback-message" class="fallback-message" role="alert" hidden>
      <div class="fallback-card">
        <h2 class="fallback-title">3Dシーンを表示できません</h2>
        <p class="fallback-description">
          お使いのブラウザまたは環境では WebGL が利用できないため、3Dボクセル壁紙を描画できませんでした。
          ハードウェアアクセラレーションが有効な最新ブラウザでお試しください。
        </p>
        <p id="fallback-reason" class="fallback-reason"></p>
      </div>
    </section>
  </main>

  <script type="module" src="./js/main.js?v=3"></script>
</body>
</html>
